[package]
name = "ytpdr"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
autobins = false
default-run = "ytpdr"
description = "High-quality YouTube video & playlist downloader with subtitle support"
readme = "README.md"
license = "MIT"
authors = ["shashank"]
keywords = ["youtube", "downloader", "playlist", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "ytpdr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
console = "0.15"
env_logger = "0.11"
indicatif = "0.17"
log = "0.4"
regex = "1.11"
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"
url = "2.5"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
codegen-units = 1
lto = true
strip = true
